name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v ./...

      - name: Build Windows GUI
        run: go build -tags windows -ldflags "-H=windowsgui -w -s" -o m4s-converter-gui.exe ./cmd/m4s-converter-gui

      - name: Build Windows CLI
        run: go build -tags windows -ldflags "-w -s" -o m4s-converter-amd64.exe

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -Path m4s-converter-gui.exe, m4s-converter-amd64.exe |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding UTF8 SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            m4s-converter-gui.exe
            m4s-converter-amd64.exe
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
